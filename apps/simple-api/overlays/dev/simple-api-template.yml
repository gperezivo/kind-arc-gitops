apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-api
  labels:
    version: ${IMAGE_VERSION}

spec:
  replicas: 3  
  template:    
    spec:
      containers:
      - name: api
        image: gperezivo/simple-api:${IMAGE_VERSION}
        resources:
          limits:
            cpu: "200m"
            memory: "300Mi"
          requests:
            cpu: "200m"
            memory: "128Mi"
